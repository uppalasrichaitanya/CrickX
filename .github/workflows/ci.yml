name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.2.2 (headless Linux)
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Warm up import cache (cold .godot misses class names on first pass)
        run: ./godot --headless --editor --path . --quit > /dev/null 2>&1 || true

      - name: Import project (editor pass — fails on script/parse errors)
        run: |
          ./godot --headless --editor --path . --quit > import.log 2>&1 || true
          if grep -q "SCRIPT ERROR" import.log; then
            echo "--- script errors found during import ---"
            grep "SCRIPT ERROR" import.log
            exit 1
          fi
          echo "import clean"

      - name: Run headless smoke test (9 matches + DRS unit + super over + full tournament)
        run: ./godot --headless --path . -s res://tests/smoke_test.gd

      - name: Run UI smoke test (scene wiring, toggle modes, quit dialog, back paths)
        run: ./godot --headless --path . -s res://tests/ui_smoke.gd

      - name: Run LAN loopback test (host + client on localhost)
        run: |
          ./godot --headless --path . -s res://tests/net_host.gd -- --port=54123 > host.log 2>&1 &
          HOST_PID=$!
          sleep 4
          ./godot --headless --path . -s res://tests/net_client.gd -- --port=54123 > client.log 2>&1 &
          CLI_PID=$!
          wait $HOST_PID
          HOST_RC=$?
          wait $CLI_PID
          CLI_RC=$?
          echo "--- host log ---"; grep -E "HOST:|NET-RESULT|SCRIPT ERROR" host.log | tail -8
          echo "--- client log ---"; grep -E "CLIENT:|NET-RESULT|SCRIPT ERROR" client.log | tail -8
          grep -q "NET-RESULT: PASS (host)" host.log || exit 1
          grep -q "NET-RESULT: PASS (client)" client.log || exit 1
          test $HOST_RC -eq 0 -a $CLI_RC -eq 0

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.2.2 + export templates
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -q templates.tpz -d ~/.local/share/godot/export_templates/4.2.2.stable

      - name: Warm up import cache
        run: ./godot --headless --editor --path . --quit > /dev/null 2>&1 || true

      - name: Create build directories (the exporter will not make them)
        run: mkdir -p build/windows build/linux

      - name: Export Windows (release)
        run: ./godot --headless --path . --export-release "Windows Desktop"

      - name: Export Linux (release)
        run: ./godot --headless --path . --export-release "Linux"

      - name: List builds
        run: ls -la build/windows build/linux

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: crickx-builds
          path: build/

  release:
    needs: [smoke-test, export]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crickx-builds
          path: dist

      - name: Package and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist && zip -qr ../CrickX-Windows.zip windows && tar -czf ../CrickX-Linux.tar.gz linux && cd ..
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" CrickX-Windows.zip CrickX-Linux.tar.gz \
            --title "CrickX $TAG" \
            --notes "Download for Windows or Linux, unzip, and run. First release — have fun! 🏏"
